# SecureChain DMS - Local development / hackathon demo stack
# Bring up with: docker compose up -d --build

networks:
  securechain-net:
    driver: bridge

volumes:
  pg_data:
    driver: local
  upload_tmp:
    driver: local

services:

  # -------------------------------------------------------------------
  # PostgreSQL 16
  # -------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: securechain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-securechain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securechain_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-securechain_dms}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - securechain-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-securechain} -d ${POSTGRES_DB:-securechain_dms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------------------------------------------
  # AI Service: FastAPI + PaddleOCR
  # -------------------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: securechain-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: info
      MAX_UPLOAD_MB: "25"
    volumes:
      - upload_tmp:/app/tmp_uploads
    networks:
      - securechain-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # -------------------------------------------------------------------
  # Backend: Node.js / Express
  # -------------------------------------------------------------------
  backend:
    profiles: ["full"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securechain-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: "5000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-securechain}:${POSTGRES_PASSWORD:-securechain_dev_pw}@postgres:5432/${POSTGRES_DB:-securechain_dms}
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET:-change_me_in_prod}
    volumes:
      - upload_tmp:/app/tmp_uploads
    networks:
      - securechain-net
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # -------------------------------------------------------------------
  # Frontend: React / Vite
  # -------------------------------------------------------------------
  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securechain-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:5000
      VITE_AI_SERVICE_URL: http://localhost:8000
    networks:
      - securechain-net
    depends_on:
      - backend
