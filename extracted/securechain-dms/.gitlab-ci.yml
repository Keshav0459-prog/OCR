# SecureChain DMS (SIH26190) — GitLab CI/CD Pipeline
# Stages: lint -> test -> security_scan -> build_and_push

stages:
  - lint
  - test
  - security_scan
  - build_and_push

variables:
  AI_SERVICE_DIR: "ai-service"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: "$CI_REGISTRY_IMAGE/ai-service:$CI_COMMIT_SHORT_SHA"
  IMAGE_LATEST: "$CI_REGISTRY_IMAGE/ai-service:latest"

# ---------------------------------------------------------------------------
# Strict pip caching — critical for hackathon iteration speed given the size
# of the paddlepaddle wheel. Keyed on the requirements.txt hash so the cache
# is invalidated only when dependencies actually change.
# ---------------------------------------------------------------------------
.python_cache: &python_cache
  key:
    files:
      - $AI_SERVICE_DIR/requirements.txt
  paths:
    - .cache/pip
  policy: pull-push

.python_base:
  image: python:3.10-slim
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends libgl1-mesa-glx libglib2.0-0 poppler-utils libgomp1 > /dev/null
    - python -m pip install --upgrade pip
    - cd $AI_SERVICE_DIR
    - pip install -r requirements.txt

# ---------------------------------------------------------------------------
# LINT STAGE
# ---------------------------------------------------------------------------
lint:flake8:
  stage: lint
  extends: .python_base
  cache:
    <<: *python_cache
  script:
    - pip install flake8
    - flake8 . --max-line-length=120 --exclude=tests,.venv --statistics
  allow_failure: false

lint:black:
  stage: lint
  extends: .python_base
  cache:
    <<: *python_cache
  script:
    - pip install black
    - black --check --diff .
  allow_failure: true

# ---------------------------------------------------------------------------
# TEST STAGE
# ---------------------------------------------------------------------------
test:pytest:
  stage: test
  extends: .python_base
  cache:
    <<: *python_cache
  script:
    - pip install pytest pytest-cov
    - pytest tests/ --cov=. --cov-report=xml:coverage.xml --cov-report=term
      --junitxml=report.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: $AI_SERVICE_DIR/report.xml
      coverage_report:
        coverage_format: cobertura
        path: $AI_SERVICE_DIR/coverage.xml
    paths:
      - $AI_SERVICE_DIR/coverage.xml
      - $AI_SERVICE_DIR/report.xml
    expire_in: 7 days

# ---------------------------------------------------------------------------
# SECURITY SCAN STAGE
# GitLab built-in SAST + Secret Detection templates.
# ---------------------------------------------------------------------------
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

sast:
  stage: security_scan

secret_detection:
  stage: security_scan
  variables:
    SECRET_DETECTION_HISTORIC_SCAN: "false"

# ---------------------------------------------------------------------------
# BUILD & PUSH STAGE — Docker-in-Docker
# ---------------------------------------------------------------------------
build_and_push:
  stage: build_and_push
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - cd $AI_SERVICE_DIR
    - docker build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .
    - docker push "$IMAGE_TAG"
    - docker push "$IMAGE_LATEST"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  needs:
    - test:pytest
    - sast
    - secret_detection
